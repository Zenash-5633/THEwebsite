<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>flexbox demo</title>
    <style>
        body {
            background-color: #eee;
            color: #444;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            max-width: 80%;
            margin: 0 auto;
        }

        #one {
            background-color: #e3b9ee;
            border: 2px solid #444;
            border-radius: 20px;
            margin-bottom: 50px;
            padding: 10px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: last baseline;
        }

        #one div {
            text-align: center;
            background-color: #f1efc1;
            border: 2px solid #4444;
            border-radius: 10px;
            flex-grow: 1;
        }

        #two {
            background-color: #e3b9ee;
            border: 2px solid #444;
            border-radius: 20px;
            margin-bottom: 50px;
            padding: 10px;
            display: flex;
            align-items: stretch;
            flex-flow:row-reverse;
            justify-content: space-evenly;
        }

        #two div {
            text-align: center;
            background-color: #f1efc1;
            border: 2px solid #4444;
            border-radius: 10px;
            flex-grow: 1;
            text-align:left;
            padding-left: 20px;
        }

        #three {
            background-color: #e3b9ee;
            border: 2px solid #444;
            border-radius: 20px;
            margin-bottom: 50px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: left;
        }

        #three div {
            text-align: center;
            background-color: #f1efc1;
            border: 2px solid #4444;
            border-radius: 10px;
            flex-grow: 1;
            width:250px;
            text-align:center;
        }
a {
    text-align:center;
    display:grid;
    padding: 10px;
    border: 5px solid #4444; 
    border-radius: 20px;
    color:black;
    background-color: #f1efc1;
    margin-left: auto;
    margin-right: auto;
    width: fit-content;
}
a:hover {
    border: 5px solid #4444;
    background-color:#e3b9ee;
    color:black;
}
    </style>
</head>

<body>
    <h2>flexbox demo setup</h2>
    <div id="one">
        <div>
            <p>one</p>
        </div>
        <div>
            <p>two</p>
        </div>
        <div>
            <p>three<br>has more text</p>
        </div>
    </div>

    <div id="two">
        <div>
            <p>one</p>
        </div>
        <div>
            <p>two</p>
        </div>
        <div>
            <p>three<br>has more text</p>
        </div>
    </div>

    <div id="three">
        <div>
            <p>one</p>
        </div>
        <div>
            <p>two</p>
        </div>
        <div>
            <p>three<br>has more text</p>
        </div>
    </div>
    <a href="index.html">The door</a>
</body>

</html>
